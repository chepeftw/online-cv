services:
  # Dev server with hot reload: docker compose up  ->  http://localhost:4321
  dev:
    image: node:lts-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Production build served by nginx: docker compose --profile prod up --build prod  ->  http://localhost:8486
  prod:
    profiles: [prod]
    build: .
    ports:
      - "8486:80"

volumes:
  node_modules:
