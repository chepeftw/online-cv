name: Validate PR

on:
  pull_request:

jobs:
  validate:
    name: Validate and build website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro files and content
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html
