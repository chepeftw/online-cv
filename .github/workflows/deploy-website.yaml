name: Deploy Website

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # manual "Run workflow" button

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::671370548051:role/github-deploy-online-cv
          aws-region: us-east-1

      # Cache-Control is set per kind of file; the CDN (infrastructure-ftw, stacks/chepeftw.com) follows it.
      - name: Upload to S3
        env:
          BUCKET: s3://s3-chepeftw.com
        run: |
          # 1. Everything that isn't a page (images, icons, ...): 1 day.
          aws s3 sync dist "$BUCKET" --delete --exclude "*.html" --cache-control "public, max-age=86400"
          # 2. Pages last. Short cache, plus the invalidation below.
          aws s3 sync dist "$BUCKET" --delete --exclude "*" --include "*.html" --cache-control "public, max-age=300"

      # Skipped until the repository variable CLOUDFRONT_DISTRIBUTION_ID is set (the distribution ID is the `cdn_id`
      # output of infrastructure-ftw's stacks/chepeftw.com; set it after that change is applied, because the deploy
      # role only gets cloudfront:CreateInvalidation from the same change).
      - name: Invalidate the CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"