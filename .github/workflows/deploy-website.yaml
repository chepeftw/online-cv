name: Deploy Website

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # manual "Run workflow" button

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::671370548051:role/github-deploy-online-cv
          aws-region: us-east-1

      - name: Copy files to the test website with the AWS CLI
        run: |
          aws s3 sync --delete ./dist s3://s3-chepeftw.com

      # Skipped until the repository variable CLOUDFRONT_DISTRIBUTION_ID is set (the distribution ID is the `cdn_id`
      # output of infrastructure-ftw's stacks/chepeftw.com; set it after that change is applied, because the deploy
      # role only gets cloudfront:CreateInvalidation from the same change).
      - name: Invalidate the CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"