version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # TypeScript 7 breaks `npm ci` (@astrojs/check peers on typescript ^5 || ^6) and `astro check` refuses to run on it
      # ("does not currently support TypeScript 7.0"). Remove this once @astrojs/check supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
